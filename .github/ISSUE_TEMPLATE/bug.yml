name: Bug report
description: Something in Skimdit does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Skimdit version
      description: Output of `skimdit version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps (and files) that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
