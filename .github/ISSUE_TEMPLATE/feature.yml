name: Feature request
description: Suggest a change. Read the non-goals in the README first.
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do on your blog, and why can't you do it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: checkboxes
    id: non-goals
    attributes:
      label: Scope
      options:
        - label: I checked that this is not one of the README's non-goals.
          required: true
